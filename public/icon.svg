<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0f172a"/>
  
  <!-- Pitch surface -->
  <rect x="60" y="60" width="392" height="392" rx="18" fill="#059669"/>
  
  <!-- Pitch stripes (alternating lighter) -->
  <rect x="60" y="60" width="49" height="392" rx="0" fill="#047857" opacity="0.6"/>
  <rect x="158" y="60" width="49" height="392" rx="0" fill="#047857" opacity="0.6"/>
  <rect x="256" y="60" width="49" height="392" rx="0" fill="#047857" opacity="0.6"/>
  <rect x="354" y="60" width="49" height="392" rx="0" fill="#047857" opacity="0.6"/>
  
  <!-- Pitch border -->
  <rect x="76" y="76" width="360" height="360" rx="8" fill="none" stroke="white" stroke-width="5" opacity="0.9"/>
  
  <!-- Center line -->
  <line x1="76" y1="256" x2="436" y2="256" stroke="white" stroke-width="4" opacity="0.9"/>
  
  <!-- Center circle -->
  <circle cx="256" cy="256" r="64" fill="none" stroke="white" stroke-width="4" opacity="0.9"/>
  
  <!-- Center dot -->
  <circle cx="256" cy="256" r="7" fill="white" opacity="0.95"/>
  
  <!-- Top penalty box -->
  <rect x="162" y="76" width="188" height="80" rx="4" fill="none" stroke="white" stroke-width="4" opacity="0.9"/>
  
  <!-- Top goal box -->
  <rect x="200" y="76" width="112" height="36" rx="2" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
  
  <!-- Bottom penalty box -->
  <rect x="162" y="356" width="188" height="80" rx="4" fill="none" stroke="white" stroke-width="4" opacity="0.9"/>
  
  <!-- Bottom goal box -->
  <rect x="200" y="400" width="112" height="36" rx="2" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>

  <!-- Football - center of pitch -->
  <circle cx="256" cy="256" r="28" fill="white" opacity="0.0"/>
</svg>
